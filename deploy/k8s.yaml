# Plain-Kubernetes example. Production runs this app as an extra app on a Jarvis 3 instance box (DE0CH/jarvis3 docs/DEPLOY.md, "Extra apps"), with a pinned image, in its own namespace.
apiVersion: apps/v1
kind: Deployment
metadata: {name: mailmerge, namespace: mailmerge}
spec:
  replicas: 1
  selector: {matchLabels: {app: mailmerge}}
  template:
    metadata: {labels: {app: mailmerge}}
    spec:
      containers:
        - name: mailmerge
          image: ghcr.io/de0ch/mailmerge:latest
          imagePullPolicy: Always
          ports: [{containerPort: 8080}]
          env: [{name: PORT, value: "8080"}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 10}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: mailmerge, namespace: mailmerge}
spec:
  selector: {app: mailmerge}
  ports: [{port: 80, targetPort: 8080}]
